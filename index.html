<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>渋谷の広告アイテム</title>
<meta name="description" content="渋谷で見つけたアーティスト広告に出てくる商品まとめ。SHIBUYAエンタメ速報">
<meta name="theme-color" content="#0b0b14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b14;
    --card: #15151f;
    --line: #262636;
    --text: #f4f4f8;
    --sub: #9a9ab0;
    --neon: #ff3d8b;
    --neon2: #3de2ff;
    --amazon: #ff9900;
    --amazon-dark: #e68a00;
    --rakuten: #bf0000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans JP", system-ui, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 16px 48px; }

  /* ヘッダー */
  header {
    text-align: center;
    padding: 40px 0 28px;
    background:
      radial-gradient(circle at 20% 0%, rgba(255,61,139,.25), transparent 55%),
      radial-gradient(circle at 80% 10%, rgba(61,226,255,.18), transparent 50%);
  }
  .logo {
    display: inline-block;
    font-weight: 900;
    font-size: 30px;
    letter-spacing: .06em;
    background: linear-gradient(90deg, var(--neon), var(--neon2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .logo-sub { font-size: 12px; color: var(--sub); letter-spacing: .2em; margin-top: 2px; }
  h1 { font-size: 22px; font-weight: 900; margin-top: 18px; }
  .lead { font-size: 14px; color: var(--sub); margin-top: 6px; }

  /* 商品カード */
  .list { display: grid; gap: 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute; inset: 0 0 auto 0; height: 3px;
    background: linear-gradient(90deg, var(--neon), var(--neon2));
  }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .badge {
    font-size: 11px; font-weight: 700;
    padding: 3px 9px; border-radius: 999px;
    background: #22222f; color: var(--sub);
  }
  .badge.new { background: var(--neon); color: #fff; }
  .collab { font-size: 13px; color: var(--neon2); font-weight: 700; }
  .product { font-size: 19px; font-weight: 900; margin: 4px 0 6px; line-height: 1.4; }
  .note { font-size: 13px; color: var(--sub); }
  .place { font-size: 12px; color: var(--sub); margin-top: 8px; }

  /* ボタン */
  .btns { display: grid; gap: 10px; margin-top: 16px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 15px 16px;
    border-radius: 14px; border: 0;
    font-family: inherit; font-size: 16px; font-weight: 900;
    text-decoration: none; cursor: pointer;
    transition: transform .08s ease, box-shadow .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(.97); }
  .btn-amazon {
    background: linear-gradient(180deg, #ffb340, var(--amazon));
    color: #1a1200;
    box-shadow: 0 6px 0 var(--amazon-dark), 0 10px 24px rgba(255,153,0,.35);
    position: relative; overflow: hidden;
  }
  .btn-amazon:active { box-shadow: 0 2px 0 var(--amazon-dark), 0 4px 12px rgba(255,153,0,.3); transform: translateY(4px); }
  .btn-amazon::after {
    content: "";
    position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
    animation: shine 2.8s ease-in-out infinite;
  }
  @keyframes shine { 0%, 60% { left: -60%; } 100% { left: 130%; } }
  .btn-amazon .arrow { animation: nudge 1.4s ease-in-out infinite; display: inline-block; }
  @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
  .btn-rakuten {
    background: transparent; color: var(--text);
    border: 1.5px solid #3a3a4d; font-size: 14px; padding: 12px 16px;
  }
  .btn-soon { background: #22222f; color: var(--sub); font-size: 14px; cursor: default; }
  @media (prefers-reduced-motion: reduce) {
    .btn-amazon::after, .btn-amazon .arrow { animation: none; }
  }

  /* SNS・フッター */
  .sns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 32px; }
  .sns a {
    text-align: center; text-decoration: none; color: var(--text);
    font-size: 13px; font-weight: 700;
    padding: 12px 6px; border-radius: 12px;
    background: var(--card); border: 1px solid var(--line);
  }
  footer { margin-top: 28px; font-size: 11px; color: var(--sub); line-height: 1.8; }
  footer p + p { margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">SHIBUYA</div>
    <div class="logo-sub">エンタメ速報</div>
    <h1>渋谷の広告に出てたアイテム</h1>
    <p class="lead">見つけた広告の商品を、ここにまとめてます📍</p>
  </header>

  <main class="list" id="list"></main>

  <nav class="sns">
    <a href="https://www.tiktok.com/@shibuyatoday" target="_blank" rel="noopener">TikTok</a>
    <a href="https://www.instagram.com/shibuyatoday1/" target="_blank" rel="noopener">Instagram</a>
    <a href="#" id="yt" target="_blank" rel="noopener">YouTube</a>
  </nav>

  <footer>
    <p>【PR】このページはアフィリエイト広告を利用しています。</p>
    <p>Amazonのアソシエイトとして、SHIBUYAエンタメ速報は適格販売により収入を得ています。</p>
    <p>掲載している商品は、渋谷の広告に写っていた商品を紹介するものです。アーティスト・ブランド各社とは関係ありません。色・容量などは購入前にリンク先でご確認ください。</p>
  </footer>
</div>

<script>
  // ===== 商品データ(ここだけ編集する) =====
  // new: true にすると「NEW」バッジが付く。上にあるものほど上に表示される
  // amazon / rakuten が空("")のボタンは「準備中」表示になる
  const ITEMS = [
    {
      collab: "田中樹 × SABON",
      product: "SABON ボディスクラブ 600g デリケート・ジャスミン",
      note: "広告に出ていたSABONのボディスクラブ",
      place: "渋谷",
      new: true,
      amazon: "https://www.amazon.co.jp/dp/B0CXJ4TSK8?psc=1&linkCode=ll2&tag=teyateya123-22&linkId=525ea31758b373c67e973a4bcde7e674&ref_=as_li_ss_tl",
      rakuten: ""
    },
    {
      collab: "Mrs. GREEN APPLE × FANCL",
      product: "ファンケル マイルドクレンジングオイル 120mL",
      note: "メンバー直筆メッセージ入りの広告に写っていたクレンジング",
      place: "渋谷スクランブルスクエア下",
      new: true,
      amazon: "https://www.amazon.co.jp/dp/B0GK5RBK1W?psc=1&linkCode=ll2&tag=teyateya123-22&linkId=149fde659e42a4df0c6ef845df653989&ref_=as_li_ss_tl",
      rakuten: ""
    },
    {
      collab: "目黒蓮 × medicube",
      product: "medicube グリシルグリシン PORE TIGHT 10 セラム",
      note: "アドトラックの広告に出ていたmedicubeの美容液",
      place: "渋谷のアドトラック",
      new: false,
      amazon: "https://www.amazon.co.jp/dp/B0H296F35T?psc=1&linkCode=ll2&tag=teyateya123-22&linkId=23cdd5d52a69a3e1f9fa949612a915e0&ref_=as_li_ss_tl",
      rakuten: ""
    }
  ];
  const YOUTUBE = ""; // YouTubeを始めたらチャンネルURLを入れる

  // ===== 表示 =====
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const link = (url, cls, label) => url
    ? `<a class="btn ${cls}" href="${esc(url)}" target="_blank" rel="sponsored noopener">${label}</a>`
    : `<span class="btn btn-soon">${cls === "btn-amazon" ? "Amazonリンク準備中" : "楽天リンク準備中"}</span>`;

  document.getElementById("list").innerHTML = ITEMS.map(it => `
    <article class="card">
      ${it.new ? '<div class="badges"><span class="badge new">NEW</span></div>' : ""}
      <div class="collab">${esc(it.collab)}</div>
      <div class="product">${esc(it.product)}</div>
      <p class="note">${esc(it.note)}</p>
      <p class="place">📍${esc(it.place)}</p>
      <div class="btns">
        ${link(it.amazon, "btn-amazon", 'Amazonでチェック <span class="arrow">→</span>')}
        ${it.rakuten ? link(it.rakuten, "btn-rakuten", "楽天で見る") : ""}
      </div>
    </article>`).join("");

  const yt = document.getElementById("yt");
  if (YOUTUBE) yt.href = YOUTUBE; else yt.remove();
  if (!YOUTUBE) document.querySelector(".sns").style.gridTemplateColumns = "repeat(2, 1fr)";
</script>
</body>
</html>
